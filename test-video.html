<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Туршилтын видео — Дүүрэн КИНО</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b16; color: #eef3fb; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; text-align: center; }
  .play { width: 84px; height: 84px; border-radius: 22px; background: linear-gradient(135deg, #22c7f0, #6366f1); display: grid; place-items: center; margin: 0 auto 18px; animation: pulse 1.6s ease-in-out infinite; }
  .play::after { content: ""; border-left: 26px solid #fff; border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 6px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0; color: #94a3bf; font-size: 14px; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
</style>
</head>
<body>
  <div>
    <div class="play"></div>
    <h1>Туршилтын видео</h1>
    <p>Төлбөр амжилттай — эрх нээгдлээ. Жинхэнэ кино удахгүй энд гарна.</p>
  </div>
</body>
</html>
